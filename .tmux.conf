# ~/.tmux.conf — reconstructed from the live server on 2026-04-16
# after the original file was accidentally deleted.

# --- Prefix --------------------------------------------------------------
set -g prefix C-x
unbind C-b
bind C-x send-prefix

# --- Behaviour -----------------------------------------------------------
set-option -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:smcup@:rmcup@'
set -as terminal-overrides ',*:U8=1'
set -as terminal-features ',xterm*:RGB'

# --- Pane border ---------------------------------------------------------
set  -g pane-border-status top
set  -g pane-border-format "#{?@pane_color,#[bg=#{@pane_color}],} #{pane_index}: #{pane_title} #[default]"

# --- Prefix-table bindings (override / add) ------------------------------
# Per-pane colour tag, consumed by pane-border-format above.
bind b set-option -p @pane_color blue
bind y set-option -p @pane_color yellow
bind r set-option -p @pane_color red
bind p set-option -p @pane_color purple
bind n set-option -p @pane_color ''

# Rebinds on top of defaults.
bind q kill-session
bind t command-prompt -p "Pane title:" "select-pane -T '%%'"

# --- Root-table bindings (no prefix needed) ------------------------------
# Split panes — mnemonic: WASD-like layout around the current pane.
bind w split-window -bv -c "#{pane_current_path}"   # new pane above
bind s split-window -v  -c "#{pane_current_path}"   # new pane below
bind a split-window -bh -c "#{pane_current_path}"   # new pane left
bind d split-window -h  -c "#{pane_current_path}"   # new pane right
bind -n C-q kill-pane
bind -n M-e select-layout -E

# Reload config
bind r source-file ~/.tmux.conf

# Move between panes with Alt + WASD.
bind -n M-w select-pane -U
bind -n M-s select-pane -D
bind -n M-a select-pane -L
bind -n M-d select-pane -R

# --- Active pane visibility (tuned for Windows Terminal "Dimidium") -----
# Dimidium bg=#141414, fg=#bab7b6, brightYellow=#fccd1a, brightBlack=#817e7e.
# Inactive panes get a slightly lighter bg and dimmer fg so the active pane
# (which keeps Dimidium's true bg) visibly pops. Active border uses the
# scheme's gold accent.
set -g window-style        'fg=#817e7e,bg=#1c1c1c'
set -g window-active-style 'fg=#bab7b6,bg=#0a0a0a'
set -g pane-border-style        'fg=#3a3a3a'
set -g pane-active-border-style 'fg=#fccd1a,bg=default'

# Status bar tuned to Dimidium (brightBlue accent).
set -g status-style                  'fg=#141414,bg=#688dfd'
set -g status-left-style             'fg=#141414,bg=#688dfd,bold'
set -g status-right-style            'fg=#141414,bg=#688dfd'
set -g window-status-current-style   'fg=#141414,bg=#688dfd,bold'
set -g window-status-style           'fg=#141414,bg=#688dfd'
